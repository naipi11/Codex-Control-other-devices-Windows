name: CodexRemote-fix release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Run repository validation
        shell: pwsh
        run: npm test

      - name: Run source-identical TrayHost smoke
        shell: pwsh
        run: ./tests/trayhost/Invoke-TrayHostSelfTest.ps1 -ProductionOnly

      - name: Build CodexRemote-fix installer
        shell: pwsh
        run: ./build/build.ps1

      - name: Upload CodexRemote-fix installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexRemote-fix installer
          path: build/dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $changelog = Get-Content -LiteralPath (Join-Path $PWD 'CHANGELOG.md') -Raw -Encoding UTF8
          $releaseSection = [regex]::Match($changelog, '(?ms)^## ' + [regex]::Escape($tag) + '\r?\n(.*?)(?=^## |\z)')
          if (-not $releaseSection.Success) {
            throw "CHANGELOG.md has no release section for $tag"
          }
          $englishSection = [regex]::Match($releaseSection.Groups[1].Value, '(?ms)^### English\r?\n(.*?)(?=^### |\z)')
          if (-not $englishSection.Success) {
            throw "CHANGELOG.md has no English release section for $tag"
          }
          $notesPath = Join-Path $env:RUNNER_TEMP ("CodexRemote-fix-$tag-release-notes.md")
          Set-Content -LiteralPath $notesPath -Value ("# CodexRemote-fix $version`n`n" + $englishSection.Groups[1].Value.Trim() + "`n") -Encoding UTF8
          $exists = $null -ne (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null)
          if (-not $exists) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "CodexRemote-fix $version" --notes-file $notesPath
          } else {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "CodexRemote-fix $version" --notes-file $notesPath
          }
          $assets = @(Get-ChildItem -LiteralPath (Join-Path $PWD 'build\dist') -File | Where-Object { $_.Extension -in @('.exe', '.txt', '.json') })
          gh release upload $tag --repo $env:GITHUB_REPOSITORY $assets.FullName --clobber
